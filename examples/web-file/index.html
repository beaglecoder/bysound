<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bysound file</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<main>
  <h1>Send a small file by sound</h1>
  <p class="lead">The file becomes one line of text (<code>BSF1|name|size|sha256|base64</code>). The receiver recomputes the SHA-256 and says whether the file is intact. One transmission lasts at most 30 s, so files are small.</p>

  <label for="band">Band</label>
  <select id="band"><option>top</option><option>high</option><option>upper</option><option selected>mid</option><option>audible</option><option>xhigh</option><option>wide</option></select>
  <label><input type="checkbox" id="robust" style="width:auto"> robust profile (half speed, more noise tolerant; top/high/upper/mid)</label>
  <label><input type="checkbox" id="session" style="width:auto"> session mode (the receiver acknowledges by sound; no progress bar on the receiver)</label>
  <p id="limits" class="note"></p>

  <h2>Send</h2>
  <input type="file" id="file">
  <p id="fileinfo" class="note"></p>
  <div class="row"><button id="send" disabled>Send</button><button id="loop" class="secondary" disabled>Loopback test (no audio)</button></div>
  <div class="meter"><div id="txbar"></div></div>
  <p id="txstatus" class="note"></p>

  <h2>Receive</h2>
  <div class="row"><button id="listen">Listen</button><button id="stop" class="secondary" disabled>Stop</button></div>
  <div class="meter"><div id="rxbar"></div></div>
  <p id="rxstatus" class="note"></p>
  <ul id="got" class="log"></ul>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
