<line x1="358" y1="293" x2="366" y2="293" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="486" y="262" width="106" height="62" rx="9" fill="#26a69a" fill-opacity="0.13" stroke="#26a69a" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.450;0.506;0.562;1" dur="5s" repeatCount="indefinite"/></rect><text x="539.0" y="288" font-size="13" text-anchor="middle" class="b" style="fill:#26a69a">Clean up</text><text x="539.0" y="307" font-size="10" text-anchor="middle">noise, echo</text>
<line x1="476" y1="293" x2="484" y2="293" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="604" y="262" width="106" height="62" rx="9" fill="#26a69a" fill-opacity="0.13" stroke="#26a69a" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.562;0.619;0.675;1" dur="5s" repeatCount="indefinite"/></rect><text x="657.0" y="288" font-size="13" text-anchor="middle" class="b" style="fill:#26a69a">Repair</text><text x="657.0" y="307" font-size="10" text-anchor="middle">damaged bytes</text>
<line x1="594" y1="293" x2="602" y2="293" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="722" y="262" width="106" height="62" rx="9" fill="#4c8dd6" fill-opacity="0.13" stroke="#4c8dd6" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.675;0.731;0.787;1" dur="5s" repeatCount="indefinite"/></rect><text x="775.0" y="288" font-size="13" text-anchor="middle" class="b" style="fill:#4c8dd6">Merge</text><text x="775.0" y="307" font-size="10" text-anchor="middle">repetitions</text>
