<rect x="250" y="262" width="106" height="62" rx="9" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.225;0.281;0.338;1" dur="5s" repeatCount="indefinite"/></rect><text x="303.0" y="288" font-size="13" text-anchor="middle" class="b" style="fill:#a371f7">Find start</text><text x="303.0" y="307" font-size="10" text-anchor="middle">preamble</text>
