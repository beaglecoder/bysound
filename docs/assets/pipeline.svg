<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="t d">
<title id="t">bysound v4 pipeline</title>
<desc id="d">Encoder pipeline from text to tones, sound through the air, and decoder pipeline from microphone to text.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e} .b{font-weight:600} @keyframes flow{to{stroke-dashoffset:-24}} .fl{stroke-dasharray:6 6;animation:flow 0.8s linear infinite} @keyframes air{to{stroke-dashoffset:40}} .air{stroke-dasharray:10 10;animation:air 1s linear infinite} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<text x="22" y="38" font-size="13" class="b" text-anchor="start">Encoder (transmitter)</text>
<rect x="22" y="52" width="136" height="62" rx="9" fill="#4c8dd6" fill-opacity="0.13" stroke="#4c8dd6" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.000;0.075;0.150;1" dur="5s" repeatCount="indefinite"/></rect><text x="90.0" y="78" font-size="13" text-anchor="middle" class="b" style="fill:#4c8dd6">Text</text><text x="90.0" y="97" font-size="10" text-anchor="middle">your message</text>
<rect x="178" y="52" width="136" height="62" rx="9" fill="#4c8dd6" fill-opacity="0.13" stroke="#4c8dd6" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.150;0.225;0.300;1" dur="5s" repeatCount="indefinite"/></rect><text x="246.0" y="78" font-size="13" text-anchor="middle" class="b" style="fill:#4c8dd6">Pack</text><text x="246.0" y="97" font-size="10" text-anchor="middle">2 digits per byte</text>
<line x1="160" y1="83" x2="176" y2="83" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="334" y="52" width="136" height="62" rx="9" fill="#26a69a" fill-opacity="0.13" stroke="#26a69a" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.300;0.375;0.450;1" dur="5s" repeatCount="indefinite"/></rect><text x="402.0" y="78" font-size="13" text-anchor="middle" class="b" style="fill:#26a69a">Blocks</text><text x="402.0" y="97" font-size="10" text-anchor="middle">48 B + checksum</text>
