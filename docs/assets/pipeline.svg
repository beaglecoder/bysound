<rect x="490" y="52" width="136" height="62" rx="9" fill="#26a69a" fill-opacity="0.13" stroke="#26a69a" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.450;0.525;0.600;1" dur="5s" repeatCount="indefinite"/></rect><text x="558.0" y="78" font-size="13" text-anchor="middle" class="b" style="fill:#26a69a">Add repair</text><text x="558.0" y="97" font-size="10" text-anchor="middle">+12 bytes / block</text>
