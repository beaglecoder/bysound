<rect x="646" y="52" width="136" height="62" rx="9" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.600;0.675;0.750;1" dur="5s" repeatCount="indefinite"/></rect><text x="714.0" y="78" font-size="13" text-anchor="middle" class="b" style="fill:#a371f7">Split</text><text x="714.0" y="97" font-size="10" text-anchor="middle">4 bits per tone</text>
<line x1="628" y1="83" x2="644" y2="83" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="802" y="52" width="136" height="62" rx="9" fill="#a371f7" fill-opacity="0.13" stroke="#a371f7" stroke-width="1.6"><animate attributeName="fill-opacity" values="0.13;0.13;0.4;0.13;0.13" keyTimes="0;0.750;0.825;0.900;1" dur="5s" repeatCount="indefinite"/></rect><text x="870.0" y="78" font-size="13" text-anchor="middle" class="b" style="fill:#a371f7">Tones</text><text x="870.0" y="97" font-size="10" text-anchor="middle">46.875 Hz grid</text>
