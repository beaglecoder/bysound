<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Bytes sent in the 5 seconds ggwave needs for 140 bytes</title>
  <style>
    .t { fill: #8b949e; font-size: 13px; }
    .h { fill: #8b949e; font-size: 15px; font-weight: 600; }
    .v { font-size: 13px; font-weight: 700; }
  </style>
  <text class="h" x="20" y="28">In the 5 seconds ggwave needs for 140 bytes, bysound sends…</text>

  <defs><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <!-- scale: 284 bytes = 380 px, x0 = 220 -->
  <g>
    <text class="t" x="20" y="72">ggwave ultrasound</text>
    <text class="t" x="20" y="88" font-size="11">15–19.4 kHz</text>
    <rect x="220" y="62" width="187" height="26" rx="5" fill="#8b949e"/><clipPath id="c1"><rect x="220" y="62" width="187" height="26" rx="5"/></clipPath><rect clip-path="url(#c1)" x="160" y="62" width="60" height="26" fill="url(#shine)"><animate attributeName="x" from="160" to="407" dur="2.4s" begin="0s" repeatCount="indefinite"/></rect>
    <text class="v" x="415" y="80" fill="#8b949e">140 B</text>
  </g>
  <g>
    <text class="t" x="20" y="122">bysound wide</text>
    <text class="t" x="20" y="138" font-size="11">15–19.5 kHz · same span</text>
    <rect x="220" y="112" width="380" height="26" rx="5" fill="#3b82f6"/><clipPath id="c2"><rect x="220" y="112" width="380" height="26" rx="5"/></clipPath><rect clip-path="url(#c2)" x="160" y="112" width="60" height="26" fill="url(#shine)"><animate attributeName="x" from="160" to="600" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></rect>
    <text class="v" x="608" y="130" fill="#3b82f6">284 B · 2×</text>
  </g>
  <g>
    <text class="t" x="20" y="172">bysound xhigh</text>
    <text class="t" x="20" y="188" font-size="11">16.5–19.5 kHz</text>
    <rect x="220" y="162" width="252" height="26" rx="5" fill="#8b5cf6"/><clipPath id="c3"><rect x="220" y="162" width="252" height="26" rx="5"/></clipPath><rect clip-path="url(#c3)" x="160" y="162" width="60" height="26" fill="url(#shine)"><animate attributeName="x" from="160" to="472" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
    <text class="v" x="480" y="180" fill="#8b5cf6">188 B</text>
  </g>
  <g>
    <text class="t" x="20" y="222">bysound high</text>
    <text class="t" x="20" y="238" font-size="11">17.25–19.5 kHz</text>
    <rect x="220" y="212" width="187" height="26" rx="5" fill="#10b981"/><clipPath id="c4"><rect x="220" y="212" width="187" height="26" rx="5"/></clipPath><rect clip-path="url(#c4)" x="160" y="212" width="60" height="26" fill="url(#shine)"><animate attributeName="x" from="160" to="407" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text class="v" x="415" y="230" fill="#10b981">140 B · same speed, most adults don't hear it</text>
  </g>
  <g>
    <text class="t" x="20" y="272">bysound top</text>
    <text class="t" x="20" y="288" font-size="11">18–19.5 kHz</text>
    <rect x="220" y="262" width="123" height="26" rx="5" fill="#14b8a6"/><clipPath id="c5"><rect x="220" y="262" width="123" height="26" rx="5"/></clipPath><rect clip-path="url(#c5)" x="160" y="262" width="60" height="26" fill="url(#shine)"><animate attributeName="x" from="160" to="343" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
    <text class="v" x="351" y="280" fill="#14b8a6">92 B · inaudible to most adults</text>
  </g>
</svg>
