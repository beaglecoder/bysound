<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Inaudible channels, 18–19.5 kHz: bysound top vs ggwave DT/MT moved to 18 kHz</title>
<style>.t{fill:#8b949e;font-size:13px}.s{fill:#8b949e;font-size:11px}.h{fill:#8b949e;font-size:15px;font-weight:600}.c{fill:#8b949e;font-size:12px;font-weight:600}.v{font-size:12px;font-weight:700}</style>
<text class="h" x="20" y="28">Inaudible channels (18–19.5 kHz): same span, different trade-offs</text>
<!-- columns: labels x 20..215; noise bars x0 = 220, 100x = 220 px; time bars x0 = 520, 14 s = 196 px (14 px per second) -->
<text class="c" x="220" y="58">Noise it tolerates (× the message's power)</text>
<text class="c" x="520" y="58">Seconds to send</text>
<rect x="520" y="66" width="10" height="10" rx="2" fill="#8b949e"/><text class="s" x="535" y="75">32 B</text>
<rect x="575" y="66" width="10" height="10" rx="2" fill="#8b949e" fill-opacity=".45"/><text class="s" x="590" y="75">140 B</text>
<line x1="220" x2="220" y1="84" y2="290" stroke="#8b949e" stroke-opacity=".5"/>
<line x1="520" x2="520" y1="84" y2="290" stroke="#8b949e" stroke-opacity=".5"/>

<text class="t" x="20" y="104">bysound top</text><text class="s" x="20" y="119">2 tones</text>
<rect x="220" y="94" width="55" height="18" rx="4" fill="#14b8a6"/><text class="v" x="283" y="107" fill="#14b8a6">×25</text>
<rect x="520" y="92" width="33" height="10" rx="3" fill="#14b8a6"/><text class="s" x="559" y="101">2.3</text>
<rect x="520" y="105" width="94" height="10" rx="3" fill="#14b8a6" fill-opacity=".45"/><text class="s" x="620" y="114">6.7</text>

<text class="t" x="20" y="146">bysound top, robust</text><text class="s" x="20" y="161">2 tones, half speed</text>
<rect x="220" y="136" width="88" height="18" rx="4" fill="#14b8a6"/><text class="v" x="316" y="149" fill="#14b8a6">×40</text>
<rect x="520" y="134" width="60" height="10" rx="3" fill="#14b8a6"/><text class="s" x="586" y="143">4.3</text>
<rect x="520" y="147" width="182" height="10" rx="3" fill="#14b8a6" fill-opacity=".45"/><text class="s" x="708" y="156">13.0</text>

<text class="t" x="20" y="188">ggwave DT fastest @18 kHz</text><text class="s" x="20" y="203">2 tones</text>
<rect x="220" y="178" width="6" height="18" rx="3" fill="#8b949e"/><text class="v" x="234" y="191" fill="#8b949e">×2.5</text>
<rect x="520" y="176" width="52" height="10" rx="3" fill="#8b949e"/><text class="s" x="578" y="185">3.7</text>
<rect x="520" y="189" width="188" height="10" rx="3" fill="#8b949e" fill-opacity=".45"/><text class="s" x="714" y="198">13.4</text>

<text class="t" x="20" y="230">ggwave MT fastest @18 kHz *</text><text class="s" x="20" y="245">1 tone, fixed length</text>
<rect x="220" y="220" width="139" height="18" rx="4" fill="#8b949e"/><text class="v" x="367" y="233" fill="#8b949e">×63</text>
<rect x="520" y="218" width="79" height="10" rx="3" fill="#8b949e"/><text class="s" x="605" y="227">5.6</text>
<text class="s" x="526" y="240">140 B: cannot (max 64 B)</text>

<text class="t" x="20" y="272">ggwave MT normal @18 kHz *</text><text class="s" x="20" y="287">1 tone, fixed length</text>
<rect x="220" y="262" width="220" height="18" rx="4" fill="#8b949e"/><text class="v" x="448" y="275" fill="#8b949e">×100</text>
<rect x="520" y="260" width="196" height="10" rx="3" fill="#8b949e"/><text class="s" x="721" y="269">16.9</text>
<text class="s" x="526" y="282">140 B: cannot (max 64 B)</text>

<text class="s" x="20" y="314">ggwave has no built-in mode above 18 kHz: these are its DT/MT modes moved to start at 18 kHz (a custom configuration). * MT needs the</text>
<text class="s" x="20" y="329">receiver to know the message length and delivered wrong 8-byte messages. Simulated: white noise over 0–24 kHz, 32-byte message,</text>
<text class="s" x="20" y="344">≥ 90 % success, one transmission. Bars are linear; the 16.9 s bar is cut at 14 s.</text>
</svg>
