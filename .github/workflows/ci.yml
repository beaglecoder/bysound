name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  c:
    name: C library + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: make -C c test cli cli-test CC=clang

  web:
    name: TypeScript (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  examples:
    name: Examples (TypeScript, C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run build:web
        working-directory: examples
      - run: npm test && npm run typecheck && npm run build
        working-directory: examples/backend-reference
      - run: make -C examples/c-wav-tools demo CC=clang

  swift:
    name: Swift (iOS/macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test -c release
        working-directory: ios
      - run: swift build
      - run: xcodebuild -project ios/Demo/BySoundDemo.xcodeproj -scheme BySoundDemo -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - run: xcodebuild -project examples/ios-share-link/ShareLink.xcodeproj -scheme ShareLink -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

  android:
    name: Kotlin (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :bysound:testDebugUnitTest :demo:assembleDebug
        working-directory: android
      - run: ./gradlew assembleDebug
        working-directory: examples/android-share-contact

  esp32:
    name: ESP32 demo (ESP-IDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: esp32
