<text x="64" y="44" fill="#888888" font-size="12">computed from each encoder's output at 48 kHz (no channel)</text>
<text x="64" y="60" fill="#888888" font-size="12">airtime includes bysound's 350 ms trailing gap and ggwave's start/end markers</text>
<text x="64" y="76" fill="#888888" font-size="12">ggwave stops at 140 B and bysound at its 30 s cap</text>
